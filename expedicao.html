<style>
/* ══════════════════════════════════════════════════════════════════════════
   ABC Parts — camada de apresentação segundo os catálogos de design.

   Medidas retiradas dos catálogos: controle 32 px, raio 8 px, linha 30 px,
   padding de célula 8 px, foco interno 2 px, checkbox 16 px, item de
   navegação ~35 px / 13 px / padding 8×12, tipo base 12 px nos controles,
   Inter na interface, monoespaçado em códigos, números tabulares.

   Cores: os catálogos descrevem ("menu escuro", "superfícies claras", "azul
   desaturado") mas não especificam valores, e o design-system-abcparts.md
   citado como fonte de verdade não foi fornecido. Os valores abaixo vêm do
   padrão oficial de documentos da ABC Parts (navy #1C2C5A, cinza #F2F2F2) e
   do símbolo do logo (vinho #8B2F3C). Substituir quando o arquivo de tokens
   estiver disponível.

   Alvos de toque: os catálogos determinam adaptar o alvo ao dispositivo e
   não copiar os 32 px de desktop para ações móveis. As ações primárias deste
   app são acionadas de pé, no galpão, possivelmente com luva — permanecem
   grandes. A densidade compacta se aplica a leitura, listas e secundários.
   ══════════════════════════════════════════════════════════════════════════ */

@font-face{
  font-family:'Inter';
  src:url('./vendor/inter-latin.woff2') format('woff2-variations');
  font-weight:100 900; font-style:normal; font-display:swap;
}

:root{
  /* superfícies */
  --bg:#f2f2f2; --surface:#ffffff; --surface-2:#f7f8fa; --surface-3:#eceef2;
  /* marca */
  --navy:#1c2c5a; --navy-2:#2a3469; --navy-3:#38416f;
  --wine:#8b2f3c; --wine-2:#73262f;
  /* texto */
  --text:#16181d; --text-2:#4a4f5a; --text-3:#767c88;
  --on-dark:#ffffff; --on-dark-2:rgba(255,255,255,.68); --on-dark-3:rgba(255,255,255,.45);
  /* semânticas — catálogo de estados: azul informação, âmbar atenção,
     vermelho falha, verde sucesso */
  --info:#1c4e8a;  --info-bg:#eaf1f9;  --info-bd:#c3d8ee;
  --warn:#8a5a12;  --warn-bg:#fdf4e3;  --warn-bd:#efdcb4;
  --danger:#a8232b;--danger-bg:#fceded;--danger-bd:#f0c9cb;
  --ok:#1a7a4c;    --ok-bg:#e8f5ee;    --ok-bd:#bfe3d0;
  /* estrutura */
  --border:#d9dce3; --border-2:#e8eaee;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  /* medidas dos catálogos */
  --r:8px; --r-lg:10px;
  --ctrl:32px; --row:30px; --cell-x:8px; --focus:2px;
  /* alvos de toque adaptados ao uso móvel */
  --tap:44px; --tap-lg:56px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:13px;line-height:1.45;font-feature-settings:'cv05' 1;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}

/* Foco visível de 2 px, conforme os catálogos. */
:focus-visible{outline:var(--focus) solid var(--wine);outline-offset:1px;border-radius:4px}
.top :focus-visible,.scan :focus-visible{outline-color:#fff}

/* Números tabulares e códigos monoespaçados. */
.mono{font-family:var(--mono);font-size:.94em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

/* ── BARRA SUPERIOR ─────────────────────────────────────────────────── */
.top{
  flex-shrink:0;background:var(--navy);color:var(--on-dark);
  padding:calc(var(--safe-t) + 10px) 12px 10px;
  display:flex;align-items:center;gap:10px;
}
.top-logo{width:26px;height:26px;border-radius:6px;flex-shrink:0;background:#fff;padding:2px}
.top-t{flex:1;min-width:0}
.top-t h1{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.top-t p{font-size:11px;color:var(--on-dark-3);margin-top:1px;letter-spacing:.01em}
.top-back{width:var(--ctrl);height:var(--ctrl);border-radius:var(--r);
  background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:17px;flex-shrink:0;position:relative}
.top-back:active{background:rgba(255,255,255,.18)}
/* A caixa visual segue os 32 px do design system, mas a área de toque é
   ampliada para 44 px sem alterar o layout da barra — os catálogos exigem
   adaptar o alvo ao dispositivo. Vale para o indicador de sincronia, que
   também é acionável. */
.top-back::after,.sync-dot::after{content:'';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:100%;height:var(--tap);min-width:var(--tap)}
.sync-dot{position:relative;cursor:pointer}

/* Indicador de sincronia — texto acompanha a cor, nunca só o ponto. */
.sync-dot{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;
  height:var(--ctrl);padding:0 10px;border-radius:var(--r);
  background:rgba(255,255,255,.1);color:var(--on-dark-2);flex-shrink:0}
.sync-dot b{width:6px;height:6px;border-radius:50%;background:#4ec78d;display:block}
.sync-dot.off b{background:#e88b8b}
.sync-dot.pend b{background:#e8bf6a}

/* ── ÁREA DE CONTEÚDO ───────────────────────────────────────────────── */
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px;display:none}
.screen.on{display:block}

/* ── NAVEGAÇÃO INFERIOR ─────────────────────────────────────────────────
   Catálogo de navegação 14: barra inferior com rótulos visíveis, área
   segura respeitada e destinos de navegação apenas.                      */
.nav{flex-shrink:0;display:flex;background:var(--surface);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
.nav button{flex:1;min-height:var(--tap);padding:6px 4px 7px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-3);font-size:10.5px;font-weight:500;position:relative}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--navy);font-weight:600}
.nav button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;
  height:2px;background:var(--wine);border-radius:0 0 2px 2px}

/* ── SUPERFÍCIES ────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:12px;margin-bottom:10px}
.card-title{font-size:10.5px;font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
.sec-title{font-size:10.5px;font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 7px;
  display:flex;align-items:center;justify-content:space-between}
.sec-title:first-child{margin-top:2px}

/* ── BOTÕES ─────────────────────────────────────────────────────────────
   Ação primária alta para uso em pé, com luva; secundários e terciários
   seguem a densidade compacta dos catálogos.                              */
.btn{width:100%;min-height:var(--tap);padding:0 14px;border-radius:var(--r);
  font-size:14px;font-weight:600;display:flex;align-items:center;
  justify-content:center;gap:8px;letter-spacing:-.005em;
  border:1px solid transparent;transition:background .12s,border-color .12s}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.45}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn-marca{background:var(--wine);color:#fff}
.btn-marca:active{background:var(--wine-2)}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:active{background:var(--navy-2)}
.btn-green{background:var(--ok);color:#fff}
.btn-ghost{background:var(--surface);color:var(--text-2);border-color:var(--border)}
.btn-ghost:active{background:var(--surface-2)}
.btn-red{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd)}
.btn-lg{min-height:var(--tap-lg);font-size:16px;font-weight:600}
.btn-sm{min-height:var(--ctrl);padding:0 12px;font-size:12.5px;font-weight:500;width:auto}
.btn-row{display:flex;gap:8px}
.btn-row .btn{width:auto;flex:1}

/* ── FORMULÁRIO ─────────────────────────────────────────────────────────
   Catálogo de formulários: rótulo sempre visível, 12 px nos controles.    */
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--text-2);
  margin-bottom:5px;letter-spacing:.01em}
.fld input,.fld select,.fld textarea{
  width:100%;min-height:var(--tap);padding:9px 10px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--surface);font-size:14px;outline:none;
  transition:border-color .12s,box-shadow .12s}
.fld textarea{min-height:60px;resize:vertical;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  border-color:var(--navy);box-shadow:0 0 0 2px rgba(28,44,90,.12);outline:none}
.fld input.mono{font-family:var(--mono);letter-spacing:0}
.fld .hint{font-size:11.5px;color:var(--text-3);margin-top:5px;line-height:1.45}

.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:var(--tap);padding:8px 0;border-bottom:1px solid var(--border-2)}
.sw:last-child{border-bottom:none}
.sw-t{font-size:13px;font-weight:500}
.sw-s{font-size:11.5px;color:var(--text-3);margin-top:1px;line-height:1.4}
.tog{width:40px;height:23px;border-radius:12px;background:var(--surface-3);
  position:relative;flex-shrink:0;transition:background .18s;
  border:1px solid var(--border)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;
  border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);
  transition:transform .18s}
.tog.on{background:var(--ok);border-color:var(--ok)}
.tog.on::after{transform:translateX(17px)}

/* ── INDICADORES ────────────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:9px 8px;text-align:center}
.kpi-v{font-size:18px;font-weight:650;letter-spacing:-.02em;line-height:1.15;
  font-variant-numeric:tabular-nums}
.kpi-l{font-size:9.5px;color:var(--text-3);font-weight:500;text-transform:uppercase;
  letter-spacing:.04em;margin-top:3px;line-height:1.25}

/* ── CARTÃO DE CONTEXTO (separação corrente / concluída) ────────────── */
.hero{background:var(--navy);color:#fff;border-radius:var(--r-lg);
  padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,255,255,.045)}
.hero-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--on-dark-3);margin-bottom:5px;position:relative}
.hero-pv{font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.15;
  word-break:break-all;position:relative;font-family:var(--mono)}
.hero-timer{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;margin:12px 0 3px;position:relative}
.hero-sub{font-size:11.5px;color:var(--on-dark-2);position:relative;line-height:1.45}
.hero-chips{display:flex;gap:6px;margin-top:11px;position:relative;flex-wrap:wrap}
.hchip{background:rgba(255,255,255,.12);border-radius:var(--r);padding:4px 9px;
  font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums}

/* ── LISTA DE ITENS ─────────────────────────────────────────────────────
   Catálogo de tabelas: padding de célula 8 px, borda discreta, código
   monoespaçado, identidade do registro sempre visível.                    */
.item{display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);
  padding:7px var(--cell-x);margin-bottom:5px;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.item-n{width:24px;height:24px;border-radius:6px;background:var(--surface-3);
  color:var(--text-2);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums}
.item-b{flex:1;min-width:0}
.item-code{font-size:14px;font-weight:600;letter-spacing:-.005em;word-break:break-all;
  line-height:1.3;font-family:var(--mono)}
.item-meta{font-size:11px;color:var(--text-3);margin-top:1px;
  font-variant-numeric:tabular-nums}
.item-x{width:var(--tap);height:var(--tap);margin:-6px -4px -6px 0;border-radius:var(--r);
  color:var(--text-3);display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0}
.item-x:active{background:var(--surface-3);color:var(--danger)}

/* ── LINHA DE REGISTRO (histórico) ──────────────────────────────────── */
.row{display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);padding:9px var(--cell-x);
  margin-bottom:5px;width:100%;text-align:left;min-height:var(--tap)}
.row:active{background:var(--surface-2)}
.row-b{flex:1;min-width:0}
.row-t{font-size:14px;font-weight:600;letter-spacing:-.005em;word-break:break-all;
  font-family:var(--mono)}
.row-s{font-size:11px;color:var(--text-3);margin-top:2px;line-height:1.4;
  font-variant-numeric:tabular-nums}
/* Números à direita, tabulares — catálogo de tabelas. */
.row-r{text-align:right;flex-shrink:0}
.row-v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row-vs{font-size:9.5px;color:var(--text-3);margin-top:1px;text-transform:uppercase;
  letter-spacing:.04em}

/* ── MARCADORES DE ESTADO ───────────────────────────────────────────────
   Texto acompanha a cor; nunca só cor.                                    */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;
  padding:1px 6px;border-radius:4px;letter-spacing:.01em;border:1px solid transparent;
  vertical-align:middle}
.tag-g{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.tag-r{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd)}
.tag-y{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.tag-n{background:var(--surface-3);color:var(--text-3);border-color:var(--border)}

/* ── ESTADO VAZIO ───────────────────────────────────────────────────────
   Catálogo de estados: explicar a ausência e a ação; sem ilustração alta. */
.empty{text-align:center;padding:26px 18px;color:var(--text-3);
  background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--r)}
.empty-i{font-size:22px;margin-bottom:7px;opacity:.4}
.empty-t{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:3px}
.empty-s{font-size:11.5px;line-height:1.5}

/* ── AVISO DE SEÇÃO / BANNER ────────────────────────────────────────────
   Condição persistente usa aviso, não toast — catálogo de estados.        */
.note{display:flex;gap:9px;padding:10px;border-radius:var(--r);
  border:1px solid var(--warn-bd);background:var(--warn-bg);margin-bottom:10px}
.note-i{flex-shrink:0;font-size:14px;line-height:1.3}
.note-b{flex:1;min-width:0}
.note-t{font-size:12.5px;font-weight:600;color:var(--warn);line-height:1.4}
.note-s{font-size:11.5px;color:var(--text-2);margin-top:2px;line-height:1.45}
.note .btn{margin-top:9px}

/* ── LISTA DESCRITIVA ───────────────────────────────────────────────── */
.dl{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid var(--border-2);font-size:13px;min-height:var(--row)}
.dl:last-child{border-bottom:none}
.dl-k{color:var(--text-3);flex-shrink:0}
.dl-v{font-weight:600;text-align:right;word-break:break-all;
  font-variant-numeric:tabular-nums}

/* ── LEITOR ─────────────────────────────────────────────────────────── */
.scan{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}
.scan.on{display:flex}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-ov{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 12px) 12px calc(var(--safe-b) + 14px)}
.scan-head{display:flex;align-items:flex-start;gap:10px;position:relative;z-index:2}
.scan-head-t{flex:1;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.85)}
.scan-head-t h2{font-size:15px;font-weight:600}
.scan-head-t p{font-size:11.5px;opacity:.8;margin-top:1px;font-family:var(--mono)}
.scan-btn-c{width:var(--tap);height:var(--tap);border-radius:var(--r);
  background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:17px;flex-shrink:0;backdrop-filter:blur(6px)}
.scan-mid{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
.reticle{width:min(70vw,270px);aspect-ratio:1;border-radius:var(--r-lg);position:relative;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.52)}
.reticle i{position:absolute;width:32px;height:32px;border:3px solid var(--wine);border-radius:2px}
.reticle i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.reticle i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.reticle i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.reticle i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:10px}
.reticle.hit i{border-color:#3ec97f}
.scan-foot{position:relative;z-index:2;display:flex;flex-direction:column;gap:9px}
.scan-msg{color:#fff;text-align:center;font-size:12.5px;
  text-shadow:0 1px 5px rgba(0,0,0,.9);min-height:18px;line-height:1.4}
.scan-acts{display:flex;gap:8px}
.scan-acts button{flex:1;min-height:var(--tap);border-radius:var(--r);
  background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:600;
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;gap:6px}
.scan-acts button.torch-on{background:var(--wine)}

/* ── PAINEL INFERIOR ────────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;z-index:300;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(22,24,29,.5);animation:fade .16s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-body{position:absolute;left:0;right:0;bottom:0;background:var(--bg);
  border-radius:14px 14px 0 0;padding:16px 14px calc(var(--safe-b) + 14px);
  animation:up .2s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-grip{width:32px;height:3px;border-radius:2px;background:var(--border);margin:-6px auto 14px}
.sheet-t{font-size:16px;font-weight:650;letter-spacing:-.015em;margin-bottom:4px}
.sheet-s{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:14px}

/* ── MENSAGEM BREVE ─────────────────────────────────────────────────────
   Toast só para confirmação breve, conforme a escolha de contêiner do
   catálogo de estados.                                                    */
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 68px);z-index:400;
  background:var(--navy);color:#fff;padding:10px 13px;border-radius:var(--r);
  font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(22,24,29,.28);
  opacity:0;transform:translateY(10px);transition:opacity .16s,transform .16s;
  pointer-events:none;text-align:center;line-height:1.4}
.toast.on{opacity:1;transform:none}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}

.flash{position:fixed;inset:0;background:#3ec97f;z-index:500;opacity:0;
  pointer-events:none;transition:opacity .1s}
.flash.on{opacity:.22}

.empty-i svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
.empty-i{opacity:.35;line-height:0;display:flex;justify-content:center}
.scan-acts button svg,.scan-btn-c svg{width:17px;height:17px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item-x svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round}
.btn-lg svg{width:19px;height:19px}
.btn-sm svg{width:14px;height:14px}
/* O triângulo de "continuar" é o único ícone preenchido. */
.btn svg path[d^="M5 3l14"]{fill:currentColor;stroke:none}

.mut{color:var(--text-3)}
.center{text-align:center}
</style>
</head>
<body>

<div class="top">
  <img class="top-logo" id="top-logo" alt="">
  <button class="top-back" id="top-back" onclick="EXP.back()" style="display:none">‹</button>
  <div class="top-t">
    <h1 id="top-title">Expedição &amp; Separação</h1>
    <p id="top-sub">ABC Parts</p>
  </div>
  <div class="sync-dot" id="sync-dot" onclick="EXP.sincronizar(true)"><b></b><span>—</span></div>
</div>

<div class="screen on" id="sc-home"></div>
<div class="screen" id="sc-sep"></div>
<div class="screen" id="sc-hist"></div>
<div class="screen" id="sc-det"></div>
<div class="screen" id="sc-cfg"></div>

<div class="nav" id="nav">
  <button class="on" data-nav="home" onclick="EXP.go('home')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8v8a2 2 0 0 1-1 1.7l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8a2 2 0 0 1 1-1.7l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>Início</button>
  <button data-nav="hist" onclick="EXP.go('hist')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Histórico</button>
  <button data-nav="cfg" onclick="EXP.go('cfg')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></svg>Config</button>
</div>

<div class="scan" id="scan">
  <video id="scan-video" playsinline muted autoplay></video>
  <canvas id="scan-canvas" style="display:none"></canvas>
  <div class="scan-ov">
    <div class="scan-head">
      <div class="scan-head-t"><h2 id="scan-title">Ler código</h2><p id="scan-sub"></p></div>
      <button class="scan-btn-c" onclick="EXP.scanClose()" aria-label="Fechar leitor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="scan-mid"><div class="reticle" id="reticle"><i></i><i></i><i></i><i></i></div></div>
    <div class="scan-foot">
      <div class="scan-msg" id="scan-msg">Aponte a câmera para o código</div>
      <div class="scan-acts">
        <button id="scan-torch" onclick="EXP.torch()" style="display:none"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v3l-1.5 2v13a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V7L9 5z"/><path d="M9 5h6"/></svg>Lanterna</button>
        <button onclick="EXP.scanManual()"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></svg>Digitar</button>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-bg" onclick="EXP.sheetClose()"></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<div class="toast" id="toast"></div>
<div class="flash" id="flash"></div>
<input id="wedge" style="position:fixed;opacity:0;pointer-events:none;top:-100px;left:0;width:1px;height:1px" autocomplete="off">

<script>
/* ══════════════════════════════════════════════════════════════════════════
   ABC PARTS — APP DE EXPEDIÇÃO E SEPARAÇÃO
   Fluxo: lê QR do PV → cronômetro inicia → lê etiqueta de cada item
          (nº de rastreabilidade = pedido de compra) → Finalizar →
          registra duração da separação e data/hora de liberação p/ produção.
   Offline-first: tudo grava em localStorage e sincroniza com o Google Sheets
   quando houver rede.
   ══════════════════════════════════════════════════════════════════════════ */

const STORE_KEY = 'abc_exp_v1';
const STORE_KEY_ANTIGA = 'cacto_exp_v1';   // versão anterior, antes da marca ABC Parts

/* Sem URL padrão de propósito: o endpoint é o da planilha da ABC Parts e
   precisa ser colado em Config. Deixar aqui a URL de outra empresa mandaria
   as separações para a planilha errada. */
const CFG_PADRAO = {
  operador: '',
  appsScriptUrl: '',
  abaSeparacao: 'Separacao',
  abaItens: 'Separacao_Itens',
  regexPV: '',
  regexItem: '',
  bip: true,
  vibrar: true,
  bloquearDuplicado: true,
  scanContinuo: true
};

let S = {
  cfg: { ...CFG_PADRAO },
  ativa: null,        // separação em andamento
  historico: [],      // separações finalizadas / canceladas
  tela: 'home',
  detId: null,
  histFiltro: 'hoje'
};

/* ── PERSISTÊNCIA ─────────────────────────────────────────────────────── */
function carregar(){
  try{
    let raw = localStorage.getItem(STORE_KEY);
    if(!raw){
      // Quem já instalou a versão anterior não perde o que registrou.
      raw = localStorage.getItem(STORE_KEY_ANTIGA);
      if(raw) localStorage.setItem(STORE_KEY, raw);
    }
    if(!raw) return;
    const d = JSON.parse(raw);
    S.cfg = { ...CFG_PADRAO, ...(d.cfg||{}) };
    S.ativa = d.ativa || null;
    S.historico = Array.isArray(d.historico) ? d.historico : [];
  }catch(e){ console.warn('Falha ao ler storage', e); }
}
function salvar(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      cfg: S.cfg, ativa: S.ativa, historico: S.historico, v: 1
    }));
  }catch(e){ toast('Sem espaço para salvar localmente', 'err'); }
}

/* ── UTILS ────────────────────────────────────────────────────────────── */
const pad = n => String(n).padStart(2,'0');
const $ = id => document.getElementById(id);

function fmtDur(ms){
  if(ms==null || isNaN(ms)) return '—';
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
function fmtDurCurto(ms){
  if(ms==null || isNaN(ms)) return '—';
  const s = Math.floor(ms/1000);
  if(s < 60) return s + 's';
  const m = Math.floor(s/60);
  if(m < 60) return m + 'min';
  return Math.floor(m/60) + 'h' + pad(m%60);
}
function fmtHora(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function fmtData(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}
function fmtDataHora(ts){
  return ts ? fmtData(ts) + ' ' + fmtHora(ts) : '—';
}
function isoLocal(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function ehHoje(ts){
  const a = new Date(ts), b = new Date();
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* Evita "PV PV-10233" quando o próprio código já traz o prefixo. */
function rotuloPV(pv){
  const v = String(pv||'').trim();
  return /^pv\b/i.test(v) ? v : 'PV ' + v;
}

function novoId(){
  const d = new Date();
  const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  return `SEP-${stamp}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
}

/* ── EXTRAÇÃO DE CÓDIGO ───────────────────────────────────────────────────
   O conteúdo do QR/código de barras varia por sistema. A regra abaixo tenta,
   em ordem:
     1. a regex configurada em Config (grupo 1, ou o match inteiro);
     2. se o conteúdo for uma URL, o último segmento ou o valor de um
        parâmetro típico (pv, pedido, id, cod, doc);
     3. se for "CHAVE=VALOR" ou "CHAVE:VALOR", o valor;
     4. o conteúdo bruto, sem espaços nas pontas.                             */
function extrair(bruto, regexStr){
  let v = String(bruto == null ? '' : bruto).trim();
  if(!v) return '';
  if(regexStr){
    try{
      const m = v.match(new RegExp(regexStr));
      if(m) return String(m[1] != null ? m[1] : m[0]).trim();
    }catch(e){ /* regex inválida: cai para heurística */ }
  }
  if(/^https?:\/\//i.test(v)){
    try{
      const u = new URL(v);
      for(const k of ['pv','PV','pedido','numero','num','id','cod','codigo','doc','oc']){
        const q = u.searchParams.get(k);
        if(q) return q.trim();
      }
      const seg = u.pathname.split('/').filter(Boolean).pop();
      if(seg) return decodeURIComponent(seg).trim();
    }catch(e){ /* URL malformada: segue */ }
  }
  const kv = v.match(/^[A-Za-zÀ-ú ._-]{1,24}\s*[:=]\s*(.+)$/);
  if(kv) return kv[1].trim();
  return v;
}

let toastTimer = null;
function toast(msg, tipo){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast on' + (tipo ? ' ' + tipo : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' + (tipo ? ' ' + tipo : ''); }, 2600);
}
let audioCtx = null;
function bip(freq, dur){
  if(!S.cfg.bip) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq || 1180;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.14, audioCtx.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur||0.11));
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + (dur||0.11) + 0.02);
  }catch(e){ /* áudio bloqueado até o 1º toque: ignorar */ }
}
function vibrar(p){
  if(S.cfg.vibrar && navigator.vibrate) { try{ navigator.vibrate(p); }catch(e){} }
}
function sucesso(){
  bip(1180, .1); vibrar(60);
  const f = $('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'), 130);
}
function erro(){ bip(320, .22); vibrar([70,60,70]); }

   DOMÍNIO — SEPARAÇÃO

function iniciarSeparacao(bruto){
  const pv = extrair(bruto, S.cfg.regexPV);
  if(!pv){ erro(); toast('Código do PV vazio', 'err'); return false; }

  const jaAberta = S.ativa && S.ativa.pv === pv;
  if(jaAberta){ toast('Separação do ' + rotuloPV(pv) + ' já está aberta'); EXP.go('sep'); return true; }

  if(S.ativa && S.ativa.itens.length){
    // Não descarta trabalho já feito sem confirmação explícita.
    confirmar({
      titulo: 'Já existe uma separação aberta',
      texto: `O <b>${esc(rotuloPV(S.ativa.pv))}</b> está em andamento com ${S.ativa.itens.length} ` +
             `item(ns) lido(s). Finalize ou cancele antes de iniciar o ${esc(rotuloPV(pv))}.`,
      ok: 'Ir para a separação aberta',
      okCls: 'btn-dark',
      onOk: () => EXP.go('sep')
    });
    return false;
  }

  const agora = Date.now();
  S.ativa = {
    id: novoId(),
    pv,
    pvBruto: String(bruto).trim(),
    operador: S.cfg.operador || '',
    inicio: agora,
    fim: null,
    itens: [],
    obs: '',
    status: 'em_andamento',
    sync: 'pendente'
  };
  salvar();
  sucesso();
  toast(rotuloPV(pv) + ' — separação iniciada', 'ok');
  EXP.go('sep');
  return true;
}

function addItem(bruto){
  if(!S.ativa){ erro(); toast('Nenhuma separação aberta', 'err'); return false; }
  const cod = extrair(bruto, S.cfg.regexItem);
  if(!cod){ erro(); toast('Código do item vazio', 'err'); return false; }

  if(S.cfg.bloquearDuplicado && S.ativa.itens.some(i => i.rastreabilidade === cod)){
    erro();
    toast('Item ' + cod + ' já foi lido neste PV', 'err');
    return false;
  }

  const agora = Date.now();
  const ant = S.ativa.itens.length ? S.ativa.itens[S.ativa.itens.length-1].ts : S.ativa.inicio;
  S.ativa.itens.push({
    seq: S.ativa.itens.length + 1,
    rastreabilidade: cod,
    bruto: String(bruto).trim(),
    ts: agora,
    desdeInicioMs: agora - S.ativa.inicio,
    desdeAnteriorMs: agora - ant
  });
  salvar();
  sucesso();
  return true;
}

function removerItem(seq){
  if(!S.ativa) return;
  let ant = S.ativa.inicio;
  S.ativa.itens = S.ativa.itens
    .filter(i => i.seq !== seq)
    .map((i, idx) => {
      const novo = { ...i, seq: idx + 1, desdeAnteriorMs: i.ts - ant };
      ant = i.ts;
      return novo;
    });
  salvar();
  renderSep();
  toast('Item removido');
}

function finalizarSeparacao(){
  if(!S.ativa) return;
  const sep = S.ativa;
  sep.fim = Date.now();
  sep.duracaoMs = sep.fim - sep.inicio;
  sep.liberadoEm = sep.fim;          // data/hora em que o PV ficou liberado p/ produção
  sep.status = 'finalizada';
  sep.sync = 'pendente';
  sep.operador = sep.operador || S.cfg.operador || '';
  S.historico.unshift(sep);
  S.ativa = null;
  salvar();
  bip(1180,.09); setTimeout(()=>bip(1560,.14), 110); vibrar([60,50,90]);
  S.detId = sep.id;
  EXP.go('det');
  sincronizar();
}

function cancelarSeparacao(){
  if(!S.ativa) return;
  const sep = S.ativa;
  sep.fim = Date.now();
  sep.duracaoMs = sep.fim - sep.inicio;
  sep.status = 'cancelada';
  sep.sync = 'nao_aplica';
  S.historico.unshift(sep);
  S.ativa = null;
  salvar();
  toast('Separação cancelada');
  EXP.go('home');
}

function acharSep(id){
  return S.historico.find(s => s.id === id) || (S.ativa && S.ativa.id === id ? S.ativa : null);
}

/* ── MÉTRICAS ─────────────────────────────────────────────────────────── */
function finalizadas(){ return S.historico.filter(s => s.status === 'finalizada'); }

function metricas(lista){
  const l = lista.filter(s => s.status === 'finalizada');
  const nPv = l.length;
  const nItens = l.reduce((t,s) => t + s.itens.length, 0);
  const totalMs = l.reduce((t,s) => t + (s.duracaoMs||0), 0);
  return {
    nPv, nItens, totalMs,
    medioMs: nPv ? totalMs / nPv : null,
    porItemMs: nItens ? totalMs / nItens : null,
    itensHora: totalMs ? (nItens / (totalMs/3600000)) : null
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   SINCRONIZAÇÃO COM GOOGLE SHEETS
   Envia via POST text/plain (evita preflight CORS no Apps Script). Se a
   resposta não puder ser lida, tenta de novo em modo no-cors e mantém o
   registro na fila até uma confirmação.
   ══════════════════════════════════════════════════════════════════════════ */

function pendentes(){
  return S.historico.filter(s => s.status === 'finalizada' && s.sync !== 'ok');
}

function payload(sep){
  return {
    action: 'separacao',
    abaSeparacao: S.cfg.abaSeparacao,
    abaItens: S.cfg.abaItens,
    separacao: {
      ID: sep.id,
      PV: sep.pv,
      Operador: sep.operador || '',
      Data: fmtData(sep.inicio),
      Inicio: isoLocal(sep.inicio),
      Fim: isoLocal(sep.fim),
      Liberado_Producao: isoLocal(sep.liberadoEm || sep.fim),
      Duracao_seg: Math.round((sep.duracaoMs||0)/1000),
      Duracao: fmtDur(sep.duracaoMs),
      Qtd_Itens: sep.itens.length,
      Tempo_Medio_Item_seg: sep.itens.length ? Math.round((sep.duracaoMs||0)/1000/sep.itens.length) : '',
      Status: sep.status,
      Observacao: sep.obs || '',
      PV_Bruto: sep.pvBruto || ''
    },
    itens: sep.itens.map(i => ({
      ID_Separacao: sep.id,
      PV: sep.pv,
      Seq: i.seq,
      Rastreabilidade: i.rastreabilidade,
      Data_Hora: isoLocal(i.ts),
      Desde_Inicio_seg: Math.round(i.desdeInicioMs/1000),
      Desde_Item_Anterior_seg: Math.round(i.desdeAnteriorMs/1000),
      Operador: sep.operador || '',
      Codigo_Bruto: i.bruto || ''
    }))
  };
}

async function enviar(sep){
  const url = (S.cfg.appsScriptUrl||'').trim();
  if(!url) return false;
  const body = JSON.stringify(payload(sep));
  try{
    // text/plain evita o preflight OPTIONS, que o Apps Script não responde.
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body,
      redirect: 'follow'
    });
    if(res.ok){
      const txt = await res.text();
      if(/"ok"\s*:\s*true/.test(txt) || /^OK/i.test(txt.trim())) return true;
      // Respondeu, mas sem confirmação reconhecível: considera entregue.
      return true;
    }
    return false;
  }catch(e){
    // CORS/rede: última tentativa às cegas, sem marcar como confirmado.
    try{
      await fetch(url, { method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, body });
    }catch(e2){ /* offline */ }
    return false;
  }
}

let sincronizando = false;
async function sincronizar(manual){
  if(sincronizando) return;
  const fila = pendentes();
  if(!fila.length){
    if(manual) toast('Nada pendente para enviar', 'ok');
    statusSync();
    return;
  }
  if(!(S.cfg.appsScriptUrl||'').trim()){
    if(manual) toast('Configure a URL do Apps Script', 'err');
    statusSync();
    return;
  }
  if(!navigator.onLine){
    if(manual) toast('Sem conexão — os dados seguem salvos no aparelho', 'err');
    statusSync();
    return;
  }
  sincronizando = true;
  statusSync('enviando');
  let ok = 0;
  for(const sep of fila){
    const r = await enviar(sep);
    sep.sync = r ? 'ok' : 'pendente';
    if(r) ok++;
  }
  salvar();
  sincronizando = false;
  statusSync();
  if(manual || ok){
    toast(ok ? `${ok} separação(ões) enviada(s) ao Sheets` : 'Envio falhou — vamos tentar de novo',
          ok ? 'ok' : 'err');
  }
  if(S.tela === 'det') renderDet();
  if(S.tela === 'hist') renderHist();
}

function statusSync(estado){
  const el = $('sync-dot');
  if(!el) return;
  const n = pendentes().length;
  const semUrl = !(S.cfg.appsScriptUrl||'').trim();
  let cls = 'sync-dot', txt;
  if(estado === 'enviando'){ cls += ' pend'; txt = 'enviando'; }
  else if(semUrl){ cls += ' off'; txt = 'local'; }
  else if(!navigator.onLine){ cls += ' off'; txt = 'offline'; }
  else if(n){ cls += ' pend'; txt = n + ' pend'; }
  else { txt = 'sync'; }
  el.className = cls;
  el.lastElementChild.textContent = txt;
}

/* ══════════════════════════════════════════════════════════════════════════
   LEITOR — câmera (BarcodeDetector nativo, com jsQR de reserva)
   + leitor bluetooth "keyboard wedge" (digita o código e dá Enter)
   ══════════════════════════════════════════════════════════════════════════ */

const Scanner = {
  stream: null, track: null, detector: null, raf: null,
  ativo: false, alvo: null, ultimo: '', ultimoTs: 0, torchOn: false,

  async abrir(alvo, titulo, sub){
    this.alvo = alvo;
    $('scan-title').textContent = titulo;
    $('scan-sub').textContent = sub || '';
    $('scan-msg').textContent = 'Aponte a câmera para o código';
    $('scan').classList.add('on');
    this.ativo = true; this.ultimo = ''; this.torchOn = false;

    if(!this.detector && 'BarcodeDetector' in window){
      try{
        const fmts = await window.BarcodeDetector.getSupportedFormats();
        const quero = ['qr_code','code_128','code_39','ean_13','ean_8','itf','codabar',
                       'data_matrix','pdf417','upc_a','upc_e'].filter(f => fmts.includes(f));
        if(quero.length) this.detector = new window.BarcodeDetector({ formats: quero });
      }catch(e){ this.detector = null; }
    }

    try{
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width:{ideal:1280}, height:{ideal:720} },
        audio: false
      });
    }catch(e){
      $('scan-msg').textContent = 'Câmera indisponível — use "Digitar"';
      toast('Sem acesso à câmera. Libere a permissão ou digite o código.', 'err');
      return;
    }
    const v = $('scan-video');
    v.srcObject = this.stream;
    try{ await v.play(); }catch(e){}
    this.track = this.stream.getVideoTracks()[0];
    const caps = this.track.getCapabilities ? this.track.getCapabilities() : {};
    $('scan-torch').style.display = caps && caps.torch ? '' : 'none';
    this.loop();
  },

  loop(){
    if(!this.ativo) return;
    const v = $('scan-video');
    let ultimaAnalise = 0, quadro = 0;

    const passo = async () => {
      if(!this.ativo) return;
      const agora = performance.now();
      // ~12 análises/s: suficiente para a leitura parecer instantânea e
      // leve o bastante para não fritar a bateria do aparelho.
      if(v.readyState >= 2 && agora - ultimaAnalise >= 80){
        ultimaAnalise = agora;
        quadro++;
        let codigo = null;

        if(this.detector){
          try{
            const r = await this.detector.detect(v);
            if(r && r.length) codigo = r[0].rawValue;
          }catch(e){ this.detector = null; }
        }
        if(!codigo && window.jsQR) codigo = this.lerQR(v, quadro % 4 !== 0);

        if(codigo) this.achou(codigo);
      }
      this.raf = requestAnimationFrame(passo);
    };
    this.raf = requestAnimationFrame(passo);
  },

  /* Decodifica QR pelo jsQR — o caminho usado onde não há BarcodeDetector
     (Safari/iOS, por exemplo). Por padrão analisa só o quadrado central, que
     é o que a mira mostra ao operador: menos pixels, leitura mais rápida e
     sem disputa com códigos vizinhos na prateleira. A cada 4 análises varre
     o quadro inteiro, para não ignorar um código pouco fora da mira.        */
  lerQR(v, sohCentro){
    const vw = v.videoWidth, vh = v.videoHeight;
    if(!vw || !vh) return null;

    const lado = sohCentro ? Math.min(vw, vh) * 0.7 : 0;
    const sx = sohCentro ? (vw - lado) / 2 : 0;
    const sy = sohCentro ? (vh - lado) / 2 : 0;
    const sw = sohCentro ? lado : vw;
    const sh = sohCentro ? lado : vh;

    const MAX = 512;
    const escala = Math.min(1, MAX / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw * escala));
    const h = Math.max(1, Math.round(sh * escala));

    const c = $('scan-canvas'), ctx = c.getContext('2d', { willReadFrequently:true });
    if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, w, h);

    const img = ctx.getImageData(0, 0, w, h);
    const q = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
    return q && q.data ? q.data : null;
  },

  achou(codigo){
    const agora = Date.now();
    // Antirrepetição: a câmera lê o mesmo código dezenas de vezes por segundo.
    if(codigo === this.ultimo && agora - this.ultimoTs < 2200) return;
    this.ultimo = codigo; this.ultimoTs = agora;

    const ret = $('reticle');
    ret.classList.add('hit'); setTimeout(()=>ret.classList.remove('hit'), 380);

    const ok = entregar(this.alvo, codigo);
    if(!ok){
      if(this.alvo === 'pv') this.fechar();   // o fluxo do PV não continua; libera a tela
      return;
    }

    if(this.alvo === 'item' && S.cfg.scanContinuo){
      $('scan-msg').textContent = `OK · ${extrair(codigo, S.cfg.regexItem)} — ${S.ativa ? S.ativa.itens.length : 0} item(ns). Leia o próximo.`;
      $('scan-sub').textContent = S.ativa ? `${rotuloPV(S.ativa.pv)} · ${S.ativa.itens.length} lido(s)` : '';
    } else {
      this.fechar();
    }
  },

  async torch(){
    if(!this.track) return;
    this.torchOn = !this.torchOn;
    try{
      await this.track.applyConstraints({ advanced: [{ torch: this.torchOn }] });
      $('scan-torch').classList.toggle('torch-on', this.torchOn);
    }catch(e){ toast('Lanterna indisponível neste aparelho', 'err'); }
  },

  fechar(){
    this.ativo = false;
    if(this.raf) cancelAnimationFrame(this.raf);
    if(this.track && this.torchOn){ try{ this.track.applyConstraints({advanced:[{torch:false}]}); }catch(e){} }
    if(this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = null; this.track = null;
    $('scan-video').srcObject = null;
    $('scan-torch').classList.remove('torch-on');
    $('scan').classList.remove('on');
    render();
  }
};

/* Encaminha um código lido (câmera, leitor bluetooth ou digitação) */
function entregar(alvo, codigo){
  if(alvo === 'pv') return iniciarSeparacao(codigo);
  if(alvo === 'item') return addItem(codigo);
  return false;
}

/* ── LEITOR BLUETOOTH / USB (keyboard wedge) ───────────────────────────────
   Coletores emulam teclado: digitam rápido e terminam com Enter. Capturamos
   o burst, desde que o foco não esteja num campo de digitação normal.       */
let wedgeBuf = '', wedgeT = 0, wedgeTimer = null;
document.addEventListener('keydown', e => {
  const alvoFoco = document.activeElement;
  const digitando = alvoFoco && /^(INPUT|TEXTAREA|SELECT)$/.test(alvoFoco.tagName) && alvoFoco.id !== 'wedge';
  if(digitando) return;

  const agora = Date.now();
  if(agora - wedgeT > 120) wedgeBuf = '';   // pausa longa = nova leitura
  wedgeT = agora;

  if(e.key === 'Enter'){
    const cod = wedgeBuf.trim();
    wedgeBuf = '';
    if(cod.length >= 3){
      e.preventDefault();
      const alvo = Scanner.ativo ? Scanner.alvo : (S.ativa ? 'item' : 'pv');
      entregar(alvo, cod);
      if(!Scanner.ativo) render();
    }
    return;
  }
  if(e.key.length === 1){
    wedgeBuf += e.key;
    clearTimeout(wedgeTimer);
    wedgeTimer = setTimeout(() => { wedgeBuf = ''; }, 400);
  }
});

function csvCampo(v){
  const s = String(v == null ? '' : v);
  return /[",;\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function csv(linhas){
  return '﻿' + linhas.map(l => l.map(csvCampo).join(';')).join('\r\n');
}
function baixar(nome, conteudo, tipo){
  const blob = new Blob([conteudo], { type: (tipo||'text/csv') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
}

function exportarCSV(qual){
  const l = finalizadas();
  if(!l.length){ toast('Nada para exportar', 'err'); return; }
  const hoje = `${new Date().getFullYear()}${pad(new Date().getMonth()+1)}${pad(new Date().getDate())}`;
  if(qual === 'sep'){
    const linhas = [['ID','PV','Operador','Data','Inicio','Fim','Liberado_Producao',
                     'Duracao_seg','Duracao','Qtd_Itens','Tempo_Medio_Item_seg','Status','Observacao']];
    l.forEach(s => {
      const p = payload(s).separacao;
      linhas.push([p.ID,p.PV,p.Operador,p.Data,p.Inicio,p.Fim,p.Liberado_Producao,
                   p.Duracao_seg,p.Duracao,p.Qtd_Itens,p.Tempo_Medio_Item_seg,p.Status,p.Observacao]);
    });
    baixar(`separacoes_${hoje}.csv`, csv(linhas));
  } else {
    const linhas = [['ID_Separacao','PV','Seq','Rastreabilidade','Data_Hora',
                     'Desde_Inicio_seg','Desde_Item_Anterior_seg','Operador']];
    l.forEach(s => payload(s).itens.forEach(i =>
      linhas.push([i.ID_Separacao,i.PV,i.Seq,i.Rastreabilidade,i.Data_Hora,
                   i.Desde_Inicio_seg,i.Desde_Item_Anterior_seg,i.Operador])));
    baixar(`separacao_itens_${hoje}.csv`, csv(linhas));
  }
  toast('CSV gerado', 'ok');
}

function textoResumo(s){
  return [
    `SEPARAÇÃO — ${rotuloPV(s.pv)}`,
    `Operador: ${s.operador || '—'}`,
    `Início: ${fmtDataHora(s.inicio)}`,
    `Fim: ${fmtDataHora(s.fim)}`,
    `Duração: ${fmtDur(s.duracaoMs)}`,
    `Liberado para produção: ${fmtDataHora(s.liberadoEm || s.fim)}`,
    `Itens (${s.itens.length}):`,
    ...s.itens.map(i => `  ${i.seq}. ${i.rastreabilidade} — ${fmtHora(i.ts)}`),
    s.obs ? `Obs.: ${s.obs}` : ''
  ].filter(Boolean).join('\n');
}

/* ══════════════════════════════════════════════════════════════════════════
   CONTROLADOR
   ══════════════════════════════════════════════════════════════════════════ */

const TELAS = { home:'sc-home', sep:'sc-sep', hist:'sc-hist', det:'sc-det', cfg:'sc-cfg' };
const TITULOS = {
  home: ['Expedição & Separação','ABC Parts'],
  sep:  ['Separação em andamento','Leia as etiquetas dos itens'],
  hist: ['Histórico','Separações registradas'],
  det:  ['Detalhe da separação','Rastreabilidade e tempos'],
  cfg:  ['Configurações','Operador, leitura e sincronia']
};

const EXP = {
  go(tela){
    S.tela = tela;
    Object.entries(TELAS).forEach(([k,id]) => $(id).classList.toggle('on', k === tela));
    document.querySelectorAll('.nav button').forEach(b =>
      b.classList.toggle('on', b.dataset.nav === tela));
    const [t, sub] = TITULOS[tela] || TITULOS.home;
    $('top-title').textContent = t;
    $('top-sub').textContent = sub;
    $('top-back').style.display = (tela === 'det' || tela === 'sep') ? '' : 'none';
    $(TELAS[tela]).scrollTop = 0;
    render();
  },
  back(){ EXP.go(S.tela === 'sep' ? 'home' : 'hist'); },
  det(id){ S.detId = id; EXP.go('det'); },
  filtro(f){ S.histFiltro = f; renderHist(); },

  lerPV(){ Scanner.abrir('pv', 'Ler QR do PV', 'Pedido de venda a separar'); },
  lerItem(){
    if(!S.ativa) return EXP.go('home');
    Scanner.abrir('item', 'Ler etiqueta do item',
      `${rotuloPV(S.ativa.pv)} · ${S.ativa.itens.length} lido(s)`);
  },
  digitarPV(){ pedirCodigo('pv'); },
  digitarItem(){ pedirCodigo('item'); },
  scanManual(){ const a = Scanner.alvo; Scanner.fechar(); pedirCodigo(a); },
  scanClose(){ Scanner.fechar(); },
  torch(){ Scanner.torch(); },

  manualOk(alvo){
    const i = $('man-input');
    const v = i ? i.value.trim() : '';
    if(!v){ toast('Digite o código', 'err'); return; }
    EXP.sheetClose();
    entregar(alvo, v);
    render();
  },
  sheetClose(){ $('sheet').classList.remove('on'); sheetOnOk = null; },
  sheetOk(){ const f = sheetOnOk; EXP.sheetClose(); if(f) f(); },

  removerItem(seq){ removerItem(seq); },
  obs(v){ if(S.ativa){ S.ativa.obs = v; salvar(); } },

  pedirFinalizar(){
    if(!S.ativa) return;
    const a = S.ativa, dur = fmtDur(Date.now() - a.inicio);
    if(!a.itens.length){
      confirmar({
        titulo: 'Finalizar sem itens?',
        texto: `Nenhuma etiqueta foi lida no <b>${esc(rotuloPV(a.pv))}</b>. O registro vai ficar sem rastreabilidade.`,
        ok: 'Finalizar mesmo assim', okCls: 'btn-green', onOk: finalizarSeparacao
      });
      return;
    }
    confirmar({
      titulo: 'Finalizar separação?',
      texto: `<b>${esc(rotuloPV(a.pv))}</b> · <b>${a.itens.length}</b> item(ns) · tempo <b>${dur}</b>.<br>` +
             `O PV será marcado como liberado para produção agora.`,
      ok: 'Finalizar', okCls: 'btn-green', onOk: finalizarSeparacao
    });
  },
  pedirCancelar(){
    if(!S.ativa) return;
    confirmar({
      titulo: 'Cancelar separação?',
      texto: `O <b>${esc(rotuloPV(S.ativa.pv))}</b> não será liberado para produção e ` +
             `as ${S.ativa.itens.length} leitura(s) ficam registradas apenas como cancelada.`,
      ok: 'Cancelar separação', okCls: 'btn-red', cancelar: 'Voltar', onOk: cancelarSeparacao
    });
  },

  cfg(k, v){ S.cfg[k] = v; salvar(); statusSync(); },
  toggle(k){ S.cfg[k] = !S.cfg[k]; salvar(); renderCfg(); },
  testar(){
    const out = $('cfg-teste-out'), amostra = $('cfg-teste');
    if(!out || !amostra) return;
    const v = amostra.value.trim();
    if(!v){
      out.innerHTML = 'Sem regex, o app usa o conteúdo lido direto (já tratando URLs e pares chave=valor).';
      return;
    }
    out.innerHTML = `PV → <b>${esc(extrair(v, S.cfg.regexPV))}</b><br>` +
                    `Item → <b>${esc(extrair(v, S.cfg.regexItem))}</b>`;
  },

  sincronizar(manual){ sincronizar(manual); },
  exportar(q){ exportarCSV(q); },
  backup(){
    baixar(`backup_expedicao_${Date.now()}.json`,
           JSON.stringify({ cfg:S.cfg, ativa:S.ativa, historico:S.historico }, null, 2),
           'application/json');
    toast('Backup gerado', 'ok');
  },
  async compartilhar(id){
    const s = acharSep(id); if(!s) return;
    const texto = textoResumo(s);
    if(navigator.share){
      try{ await navigator.share({ title: 'Separação ' + rotuloPV(s.pv), text: texto }); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    try{ await navigator.clipboard.writeText(texto); toast('Resumo copiado', 'ok'); }
    catch(e){ toast('Não foi possível compartilhar', 'err'); }
  },
  pedirLimpar(){
    confirmar({
      titulo: 'Limpar histórico?',
      texto: pendentes().length
        ? `<b>Atenção:</b> ${pendentes().length} separação(ões) ainda não foram enviadas ao Sheets e serão perdidas. Faça o backup antes.`
        : 'As separações já enviadas continuam no Google Sheets. Só o histórico do aparelho é apagado.',
      ok: 'Apagar', okCls: 'btn-red',
      onOk(){ S.historico = []; salvar(); toast('Histórico limpo'); EXP.go('cfg'); }
    });
  }
};
window.EXP = EXP;

/* ── CRONÔMETRO ───────────────────────────────────────────────────────── */
setInterval(() => {
  if(!S.ativa) return;
  const ms = Date.now() - S.ativa.inicio;
  const t1 = $('sep-timer'); if(t1 && S.tela === 'sep') t1.textContent = fmtDur(ms);
  const t2 = $('home-timer'); if(t2 && S.tela === 'home') t2.textContent = fmtDur(ms);
  const med = $('sep-med');
  if(med && S.tela === 'sep' && S.ativa.itens.length){
    med.textContent = fmtDurCurto(ms / S.ativa.itens.length) + '/item';
  }
}, 1000);

});

});
